<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tsukimori — Moon-Forest Ninja RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1ecfb;--panel:#fffdfe;--panel2:#f6f0fd;--ink:#3b2e5a;--muted:#7a6d98;--line:#e3d7f3;
  --btn:#6c5ce7;--btn-ink:#ffffff;--hi:#ff9f6e;--gold:#c07a12;--good:#2f9a62;--bad:#e04e62;
  --hp:#ff6b81;--cp:#5b8cff;--xp:#ffb347;--barbg:rgba(108,92,231,.13);
  --sky1:#b9c6ff;--sky2:#ffc9de;--sky3:#ffe6c7;--mtn1:#b6a8e6;--mtn2:#9a8ed8;--tree:#8a7fd0;
  --ground:#a6dcae;--path:#fdeccb;--moon:#fff8e6;--star:0;--wall:#fffaf2;--wood:#8a5a44;--roof:#7a6ae8;
  --field1:#c3ceff;--field2:#ffd3e2;--field-ground:#a8dcb0;--dot:rgba(108,92,231,.10);
  --shadow:0 2px 0 rgba(108,92,231,.08),0 8px 22px rgba(108,92,231,.12);
  --display:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1636;--panel:#262050;--panel2:#2f2862;--ink:#f3eeff;--muted:#b3a8dc;--line:#3f3680;
  --btn:#ffb38a;--btn-ink:#2a1a3a;--hi:#ffb38a;--gold:#ffd27a;--good:#6fe0a0;--bad:#ff7a8a;
  --hp:#ff6b81;--cp:#6f9bff;--xp:#ffc36b;--barbg:rgba(255,255,255,.1);
  --sky1:#120f33;--sky2:#2b2466;--sky3:#4a3a86;--mtn1:#2c2566;--mtn2:#221d52;--tree:#1a1745;
  --ground:#1f3a4a;--path:#3a3560;--moon:#fff3cf;--star:.9;--wall:#f3e9dc;--wood:#5a3a2e;--roof:#3a2f8a;
  --field1:#15123a;--field2:#3a2f78;--field-ground:#1f3a4a;--dot:rgba(255,255,255,.045);
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1b1636;--panel:#262050;--panel2:#2f2862;--ink:#f3eeff;--muted:#b3a8dc;--line:#3f3680;
  --btn:#ffb38a;--btn-ink:#2a1a3a;--hi:#ffb38a;--gold:#ffd27a;--good:#6fe0a0;--bad:#ff7a8a;
  --hp:#ff6b81;--cp:#6f9bff;--xp:#ffc36b;--barbg:rgba(255,255,255,.1);
  --sky1:#120f33;--sky2:#2b2466;--sky3:#4a3a86;--mtn1:#2c2566;--mtn2:#221d52;--tree:#1a1745;
  --ground:#1f3a4a;--path:#3a3560;--moon:#fff3cf;--star:.9;--wall:#f3e9dc;--wood:#5a3a2e;--roof:#3a2f8a;
  --field1:#15123a;--field2:#3a2f78;--field-ground:#1f3a4a;--dot:rgba(255,255,255,.045);
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2}
h3{font-size:17px}
p{margin:.4em 0}
.muted{color:var(--muted)}
.center{text-align:center}
#app{max-width:960px;margin:0 auto;padding:0 12px 48px}
.scr-title{font-family:var(--display);font-weight:400;font-size:26px;margin:16px 2px 12px;letter-spacing:.01em}
.sub{font-family:var(--display);font-weight:400;font-size:18px;margin:22px 2px 10px}
.stack>*+*{margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.btn{font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--c,var(--btn));color:#fff}
.bar{position:relative;height:12px;background:var(--barbg);border-radius:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .45s ease;border-radius:6px}
.bar.cp i{background:var(--cp)}
.bar.xp i{background:var(--xp)}
.bar b{position:relative;display:block;text-align:center;font-size:9.5px;line-height:12px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.7);font-weight:800}
.bar.thin{height:6px}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.hud-id{display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;cursor:pointer;flex:1 1 160px;min-width:0;text-align:left;padding:0}
.face{width:42px;height:42px;border-radius:50%;background:var(--panel2);overflow:hidden;border:2px solid var(--hi);flex:none}
.face svg{width:100%;height:100%;display:block}
.hud-txt{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.hud-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hud-txt small{color:var(--muted);font-size:12px;line-height:1.2}
.hud-txt em{color:var(--hi);font-style:normal;font-weight:800}
.hud-gold{font-weight:800;color:var(--gold);font-size:15px}
.hud-nav{display:flex;gap:4px}
.hud-nav button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:54px;line-height:1.25}
.hud-nav button span:first-child{font-size:17px}
.hud-nav .on{border-color:var(--hi);box-shadow:inset 0 -3px 0 var(--hi)}

/* Title */
.title{text-align:center;padding:22px 0 10px}
.title-art{position:relative;height:250px;display:grid;place-items:center}
.moonbg{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 38% 36%,var(--moon),color-mix(in srgb,var(--moon) 70%,var(--hi)) 70%);box-shadow:0 0 90px color-mix(in srgb,var(--hi) 45%,transparent)}
.title-ninja{position:relative}
.title-ninja svg{height:240px;display:block}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,76px);letter-spacing:.02em;margin-top:6px}
.title h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.title-btns{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:22px auto 0}
.lede{max-width:44ch;margin:12px auto 0;color:var(--muted)}

/* Create */
.create-grid{display:grid;gap:12px}
@media(min-width:720px){.create-grid{grid-template-columns:280px 1fr}}
.preview{text-align:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel) 70%)}
.preview-sprite svg{height:230px;display:block;margin:0 auto}
.preview-name{font-family:var(--display);font-size:20px;margin:4px 0 8px;word-break:break-word}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:13px;font-weight:800;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);width:100%}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);cursor:pointer;background:var(--c);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--hi)}
.el-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.el-card{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.el-card.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.el-ic{font-size:26px;line-height:1.1}
.el-card b{font-size:16px}
.el-card small{color:var(--muted);font-size:12px;line-height:1.35}
.el-card .beats{color:var(--c);font-weight:800;filter:brightness(.85)}
.wheel-wrap{display:grid;gap:8px;align-items:center;margin-top:12px}
@media(min-width:620px){.wheel-wrap{grid-template-columns:260px 1fr}}
.wheel{width:100%;max-width:260px;display:block;margin:0 auto}
.wl{stroke:var(--muted);stroke-width:2.2}
.ah{fill:var(--muted)}
.wt{font-size:11px;font-weight:800;fill:var(--ink);font-family:var(--body)}
.wc{font-size:11px;fill:var(--muted);font-family:var(--body);font-weight:700}
.wn.hl circle{stroke:var(--ink);stroke-width:3}

/* Hub */
.village-wrap{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-top:14px;border:1px solid var(--line);background:var(--sky1)}
.village{display:block;width:100%;height:auto}
.village .s1{stop-color:var(--sky1)}.village .s2{stop-color:var(--sky2)}.village .s3{stop-color:var(--sky3)}
.moon{fill:var(--moon)}
.stars circle{fill:#fff;opacity:var(--star)}
.mtn1{fill:var(--mtn1)}.mtn2{fill:var(--mtn2)}.tree{fill:var(--tree)}
.ground{fill:var(--ground)}.vpath{fill:var(--path)}
.wall{fill:var(--wall);stroke:var(--wood);stroke-width:3}
.roof{fill:var(--roof)}
.win{fill:#ffd88a}
.door,.wood{fill:var(--wood)}
.board{fill:#b98a58;stroke:var(--wood);stroke-width:4}
.note{fill:#f6efdc;stroke:#c9b58f}
.notet{font:800 14px var(--body);fill:#5a3d2b}
.noren{fill:#2a336b}
.emblem{fill:#e7c35a}
.string{fill:none;stroke:var(--wood);stroke-width:2}
.lanb{fill:#e8553a}
.vtag rect{fill:var(--panel);stroke:var(--hi);stroke-width:3}
.vtag text{font:800 22px var(--body);fill:var(--ink)}
.bld{cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-box:fill-box;transform-origin:50% 100%;outline:none}
.bld:hover,.bld:focus-visible{filter:drop-shadow(0 0 10px #ffd27a);transform:translateY(-4px)}
.ff{fill:#ffe98a;animation:ff 4.5s ease-in-out infinite}
@keyframes ff{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(7px,-12px)}}
.hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:720px){.hub-grid{grid-template-columns:repeat(4,1fr)}}
.hub-btn{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.hub-btn .hi{font-size:28px;line-height:1}
.hub-btn b{display:block;font-size:15px}
.hub-btn small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.notice{margin-top:12px;border-color:var(--hi);cursor:pointer;font-weight:700}
.soon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:720px){.soon-grid{grid-template-columns:repeat(4,1fr)}}
.soon{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--muted)}
.soon b{color:var(--ink);display:block}
.soon small{display:block;font-size:12px}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer}
.tab.on{background:var(--c,var(--btn));border-color:var(--c,var(--btn));color:#fff}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0 2px 10px}

/* Missions */
.mission{position:relative;border-top:6px solid var(--c)}
.mission header{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.rank-badge{flex:none;width:46px;height:46px;border-radius:8px;border:3px solid var(--c);color:var(--c);font-family:var(--display);font-size:26px;display:grid;place-items:center;transform:rotate(-6deg);background:var(--panel)}
.mission h3{font-size:17px}
.mission header small{color:var(--muted);font-size:12.5px}
.stages{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0}
.stage{display:flex;gap:2px;background:var(--panel2);border-radius:12px;padding:4px 8px;position:relative}
.arrow{color:var(--muted);font-weight:800}
.mini{width:46px;text-align:center}
.mini svg{width:46px;height:64px;display:block}
.mini.flip svg{transform:scaleX(-1)}
.mini small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.bosstag{position:absolute;top:-9px;right:-6px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px}
.rewards{display:flex;gap:8px;flex-wrap:wrap;font-weight:800;margin-bottom:12px;font-size:14px}
.rewards span{background:var(--panel2);padding:3px 10px;border-radius:999px}
.rewards .fc{background:color-mix(in srgb,var(--hi) 25%,var(--panel2))}
.locked{opacity:.62}

/* Academy / skills */
.loadout{margin-bottom:14px}
.lo-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lo-head small{color:var(--muted)}
.lo-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lo-slot{aspect-ratio:1;border-radius:12px;border:2px solid var(--c,var(--line));background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;cursor:pointer;color:var(--ink);padding:2px;min-width:0}
.lo-slot small{font-size:8.5px;line-height:1.1;text-align:center;overflow:hidden;max-height:2.3em;font-weight:700}
.lo-slot.empty{border-style:dashed;color:var(--muted);cursor:default;font-size:14px}
.skill{display:grid;grid-template-columns:50px 1fr;gap:10px 12px;border-left:6px solid var(--c)}
.sk-ic{width:50px;height:50px;border-radius:12px;background:color-mix(in srgb,var(--c) 24%,var(--panel));display:grid;place-items:center;font-size:25px}
.sk-body h4{font-size:16px}
.sk-body h4 small{font-family:var(--body);color:var(--muted);font-size:12px;font-weight:700;margin-left:4px}
.sk-body p{font-size:13.5px;color:var(--muted);margin:2px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag.cp{color:var(--cp)}
.sk-act{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.owned{font-size:12px;font-weight:800;color:var(--good)}

/* Shop / home */
.item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}
.item-ic{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:12px}
.item-b b{display:block;font-size:15px}
.item-b small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.item-b .bonus{color:var(--good);font-weight:800}
.item-act{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:92px}
.home-grid,.char-grid{display:grid;gap:12px}
@media(min-width:720px){.home-grid,.char-grid{grid-template-columns:280px 1fr}}
.doll{text-align:center}
.doll-sprite svg{height:220px;width:auto;display:block;margin:0 auto}
.mini-stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.mini-stats span{font-size:12px;font-weight:800;background:var(--panel2);border-radius:999px;padding:2px 9px}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.slot small{display:block;color:var(--muted);font-size:12px}
.slot b{display:block}
.slot .bonus{color:var(--good);font-weight:800}

/* Character */
.srow{display:grid;grid-template-columns:30px 1fr auto 40px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow .sic{font-size:20px}
.srow b{display:block}
.srow small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.srow .sv{font-family:var(--display);font-size:20px}
.plus{width:38px;height:38px;border-radius:50%;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-size:20px;font-weight:800;cursor:pointer;padding:0}
.plus:disabled{opacity:.3;cursor:not-allowed}
.pts{font-weight:700;margin-bottom:4px}
.pts b{color:var(--hi);font-size:20px;font-family:var(--display);font-weight:400}
.derived{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.derived span{font-size:12.5px;font-weight:700;background:var(--panel2);padding:3px 10px;border-radius:999px}
.rank-line b{font-family:var(--display);font-weight:400;font-size:20px;display:block;margin-top:6px}
.rank-line small{color:var(--muted)}
.xpline{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;font-weight:800;margin:10px 0}
.ranks{list-style:none;padding:0;margin:8px 0 0;display:flex;gap:6px;overflow-x:auto}
.ranks li{flex:1 0 116px;padding:8px 10px;border-radius:10px;background:var(--panel2);opacity:.55;border:2px solid transparent}
.ranks li.done{opacity:1}
.ranks li.cur{border-color:var(--hi)}
.ranks b{display:block;font-size:13.5px}
.ranks small{color:var(--muted);font-size:11.5px}
.records{display:flex;gap:8px;flex-wrap:wrap}
.records span{font-weight:700;background:var(--panel2);padding:4px 12px;border-radius:999px;font-size:13px}

/* Battle */
.battle{padding-top:10px}
.bt-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bt-title b{font-family:var(--display);font-weight:400;font-size:18px;display:block;line-height:1.2}
.bt-title small{color:var(--muted);font-weight:700}
.boss-flag{color:var(--bad);font-weight:800}
.turnorder{display:flex;gap:4px;overflow-x:auto;margin:8px 0;scrollbar-width:none;align-items:center}
.turnorder::-webkit-scrollbar{display:none}
.to{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.to.ally{border-color:var(--cp)}
.to.enemy{border-color:var(--bad)}

<header id="hud"></header>
<main id="app"><div id="main"></div></main>
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="guide-fab" class="hidden" data-act="openGuide" aria-label="Ask Momo, your guide"></button>
<aside id="guide" class="hidden" aria-label="Momo the guide"></aside>
<script>
'use strict';
/* =====================================================================
   TSUKIMORI — a turn-based ninja RPG in one file (vanilla JS, SVG art)
   ---------------------------------------------------------------------
   EXTENSION GUIDE
   • All content is data: ELEMENTS, STATUSES, SKILLS, ENEMIES, ITEMS,
     MISSIONS, RANKS. Add an entry and it shows up in the Academy, Shop
     or Mission Board automatically (C/B/A/S ranks just need missions).
   • Battles are side-vs-side arrays: startBattle(allies, enemies, meta).
     A "unit" is a plain object from mkUnit(). controller:'player' waits
     for input; controller:'ai' runs aiAct(). Up to 3v3 is supported by
     layout, AoE skills ('allEnemies') and targeting already.
       - Pets:      push unitFromPet(def) into allies in startStage().
       - PvP ghosts: unitFromGhost(savedChar) = any build as an AI foe.

function clanPerkText(cl, tier){
  const m = 1 + 0.25 * tier, p = cl.perk, t = [], pc = v => Math.round(v * m * 100) + '%';
  if(p.hpPct) t.push(`+${pc(p.hpPct)} HP`); if(p.cpPct) t.push(`+${pc(p.cpPct)} Chakra`);
  if(p.agiPct) t.push(`+${pc(p.agiPct)} Agility`); if(p.atkPct) t.push(`+${pc(p.atkPct)} Power`);
  if(p.crit) t.push(`+${(p.crit * m).toFixed(1)}% crit`); if(p.dodge) t.push(`+${(p.dodge * m).toFixed(1)}% dodge`);

}

function shade(hex, p){
  let h = String(hex || '#888888').replace('#','');
  if(h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* ============================ STATE ============================ */
const SAVE_KEY = 'tsukimori_save_v1';
let S = null;     // saved game state (single object)
let B = null;     // live battle (not saved)
let RUN = null;   // live run: mission | arena | event (not saved)
const UI = {screen:'title', tab:{missions:'D', academy:null, shop:'weapon'}, create:defaultCreate(), itemPanel:false, results:null};

function defaultCreate(){ return {name:'', gender:'m', hairStyle:'spiky', hair:'#2b2b3a', outfit:'#3a5a8c', eyes:'#3b6fd6', skin:'#f3d2b3', element:'fire'}; }
function defaultState(){
  return {version:2, char:null, inventory:{salve:3, pill:2}, missions:{}, stats:{won:0, lost:0, missions:0},
    settings:{speed:1}, shards:0,
    arena:{rating:1000, wins:0, losses:0, opps:[]},
    event:{week:-1, bossLvl:0, pool:0, dmg:0, day:'', tries:0, claimed:[], best:0, kills:0, commClaimed:[]},
    counters:{wins:0, missions:0, skills:0, crits:0, strong:0, arena:0, event:0, social:0}, daily:null, ach:[], login:{day:'', streak:0},
    squad:defaultSquad()};
}
function starterSkill(el){ return SKILLS.find(s => s.el === el && s.lvl === 1 && !s.enemyOnly && !s.petOnly).id; }
function newCharacter(cr){
  const first = starterSkill(cr.element);
  return {name:cr.name.trim().slice(0,16) || 'Nameless', element:cr.element,
    look:{gender:cr.gender, hairStyle:cr.hairStyle, hair:cr.hair, outfit:cr.outfit, eyes:cr.eyes, skin:cr.skin},
    level:1, xp:0, gold:120, points:0, alloc:{hp:0, cp:0, agi:0},
    equip:{weapon:'kunai_train', clothing:null, back:null, accessory:null},
    skills:[first], loadout:[first], pets:[], pet:null, bond:{}, clan:null};
}
function persist(){ try{ if(S && S.char) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
// Normalizes a character (the player's, or an imported ghost) so every field exists.
function normChar(o){
  const c = Object.assign({level:1, xp:0, gold:0, points:0, skills:[], loadout:[], pets:[], pet:null, bond:{}, clan:null}, o);
  c.name = String(c.name || 'Nameless').slice(0, 16);
  c.alloc = Object.assign({hp:0, cp:0, agi:0}, o.alloc || {});
  c.equip = Object.assign({weapon:null, clothing:null, back:null, accessory:null}, o.equip || {});
  for(const sl of SLOTS) if(c.equip[sl] && !ITEM[c.equip[sl]]) c.equip[sl] = null;
  c.look = Object.assign(defaultCreate(), o.look || {}); delete c.look.name; delete c.look.element;
  if(!ELEMENTS[c.element]) c.element = 'fire';
  c.level = clamp(c.level | 0, 1, MAX_LEVEL);
  c.skills = (c.skills || []).filter(id => SKILL[id]);
  if(!c.skills.length) c.skills = [starterSkill(c.element)];
  c.loadout = (c.loadout || []).filter(id => c.skills.includes(id)).slice(0, MAX_LOADOUT);
  c.pets = (c.pets || []).filter(id => PET[id]);
  if(c.pet && !c.pets.includes(c.pet)) c.pet = null;
  c.bond = Object.assign({}, o.bond || {});
  if(c.clan && !CLAN[c.clan.id]) c.clan = null;
  c.squad = Array.isArray(o.squad) ? o.squad.slice(0, MAX_SQUAD).map(x => Object.assign(normChar(Object.assign({}, x, {squad:[]})), {squad:[]})) : [];
  return c;
}
function migrate(o){
  if(o && o.char === undefined && o.name && o.element) o = {char:o}; // bare character JSON
  if(!o || typeof o !== 'object' || !o.char || typeof o.char.name !== 'string') throw new Error('That text is not a Tsukimori save.');
  const d = defaultState(), s = Object.assign(d, o);
  s.char = normChar(o.char);
  s.inventory = Object.assign({}, o.inventory || {});
  for(const k in s.inventory) if(!ITEM[k] || !(s.inventory[k] > 0)) delete s.inventory[k];
  s.missions = Object.assign({}, o.missions || {});
  s.settings = Object.assign({speed:1}, o.settings || {});
  s.stats = Object.assign({won:0, lost:0, missions:0}, o.stats || {});
  s.arena = Object.assign(defaultState().arena, o.arena || {});
  s.event = Object.assign(defaultState().event, o.event || {});
  s.shards = o.shards | 0;
  s.counters = Object.assign(defaultState().counters, o.counters || {});
  s.ach = Array.isArray(o.ach) ? o.ach : [];
  s.login = Object.assign({day:'', streak:0}, o.login || {});
  s.settings = Object.assign({speed:1, sound:true, auto:false}, o.settings || {});
  s.squad = Object.assign(defaultSquad(), o.squad || {});
  s.squad.roster = (s.squad.roster || []).filter(r => r && r.id).map(r => Object.assign(normChar(r), {squad:[]}));
  s.squad.active = (s.squad.active || []).filter(id => s.squad.roster.some(r => r.id === id)).slice(0, MAX_SQUAD);
  s.squad.pool = (s.squad.pool || []).map(r => Object.assign(normChar(r), {squad:[]}));
  s.version = 4;
  return s;
}
function addInv(id, n){ S.inventory[id] = (S.inventory[id] || 0) + n; if(S.inventory[id] <= 0) delete S.inventory[id]; }

/* ============================ PROGRESSION ============================ */
function xpToNext(l){ return Math.floor(50 * Math.pow(l, 1.5)); }
function rankOf(l){ let r = RANKS[0]; for(const x of RANKS) if(l >= x.min) r = x; return r; }
function gainXp(amount){
  const c = S.char, ups = [];
  if(c.level >= MAX_LEVEL) return ups;
  c.xp += amount;
  while(c.level < MAX_LEVEL && c.xp >= xpToNext(c.level)){ c.xp -= xpToNext(c.level); c.level++; c.points += POINTS_PER_LEVEL; ups.push(c.level); }
  if(c.level >= MAX_LEVEL) c.xp = 0;
  return ups;
}
function clanBonus(c){
  if(!c.clan || !CLAN[c.clan.id]) return {};
  const cl = CLAN[c.clan.id], m = 1 + 0.25 * clanTier(c.clan.rep || 0), p = cl.perk, o = {};
  for(const k in p) o[k] = typeof p[k] === 'number' ? p[k] * m : p[k];
  return o;
}
function gearBonus(c){
  const g = {hp:0, cp:0, agi:0, atk:0, crit:0, dodge:0};
  for(const sl of SLOTS){ const it = ITEM[c.equip[sl]]; if(it && it.bonus) for(const k in it.bonus) g[k] = (g[k] || 0) + it.bonus[k]; }
  return g;
}
function charStats(c){
  const g = gearBonus(c), cb = clanBonus(c);
  const agi = Math.round((5 + c.level + c.alloc.agi * 2 + g.agi) * (1 + (cb.agiPct || 0)));
  return {maxHp:Math.round((90 + c.level * 12 + c.alloc.hp * 10 + g.hp) * (1 + (cb.hpPct || 0))),
          maxCp:Math.round((40 + c.level * 5 + c.alloc.cp * 6 + g.cp) * (1 + (cb.cpPct || 0))),
          agi, atk:Math.round((8 + c.level * 2 + g.atk) * (1 + (cb.atkPct || 0))),
          crit:Math.min(50, 5 + agi * 0.15 + g.crit + (cb.crit || 0)), dodge:g.dodge + (cb.dodge || 0),
          elem:cb.elem || null, elemPct:cb.elemPct || 0, g};
}
function skillPrice(s){ return s.el === S.char.element ? s.price : s.price * 2; }
function skillTags(s){
  const t = [];
  if(s.power) t.push(`${s.hits > 1 ? s.hits + '×' : ''}${Math.round(s.power * 100)}% power`);
  if(s.target === 'allEnemies') t.push('All foes');
  if(s.target === 'ally') t.push('Ally');
  if(s.heal) t.push(`Heal ${Math.round(s.heal * 100)}%`);
  if(s.cpRestore) t.push(`+${Math.round(s.cpRestore * 100)}% CP`);
  if(s.cleanse) t.push('Cleanse');

/* ---- ghost generator ---- */
const SYL1 = ['Ao','Hi','Ka','Ren','Sora','Yu','Mi','Tsu','Ha','Ko','Na','Ri','Shi','Ta','Ki','Se','Fu','Ma'];

const pick = a => a[Math.floor(Math.random() * a.length)];
function makeGhost(level, squadN = 0){
  level = clamp(level, 1, MAX_LEVEL);
  const el = pick(EL_ORDER), arch = pick(GHOST_ARCHETYPES), gender = Math.random() < 0.5 ? 'm' : 'f';
  const g = {name:pick(SYL1) + pick(SYL2) + pick(SYL3), element:el, level, archetype:arch.name,

    alloc:{hp:0, cp:0, agi:0}, equip:{}, skills:[], loadout:[], pets:[], pet:null, bond:{}, clan:null};

  for(const sl of SLOTS){
    const opts = ITEMS.filter(i => i.slot === sl && i.lvl <= level && !i.shards).sort((a, b) => b.lvl - a.lvl).slice(0, 2);

  }

  g.loadout = g.skills.slice(0, MAX_LOADOUT);
  const pets = PETS.filter(p => p.lvl <= level && !p.shards);

function soloPower(c){ const s = charStats(c); return Math.round(s.maxHp * 0.25 + s.atk * 3 + s.agi * 2 + s.maxCp * 0.2 + c.loadout.length * 8); }

/* ============================ BATTLE ENGINE ============================ */
function later(fn, ms){ const b = B; setTimeout(() => { if(B === b && B) fn(); }, ms / ((S && S.settings.speed) || 1)); }
const hasStatus = (u, s) => u.statuses.some(x => x.s === s);
const effAgi = u => u.agi * (hasStatus(u, 'slow') ? 0.6 : 1) * (hasStatus(u, 'haste') ? 1.4 : 1);
const opponents = u => (u.side === 'ally' ? B.enemies : B.allies).filter(x => x.alive);
const friends = u => (u.side === 'ally' ? B.allies : B.enemies).filter(x => x.alive);
const allUnits = () => [...B.allies, ...B.enemies];
function dodgeChance(att, def){ return clamp(5 + (effAgi(def) - effAgi(att)) * 1.2 + (def.dodge || 0) + (hasStatus(def, 'haste') ? 10 : 0), 3, 45); }
function log(msg){ if(!B) return; B.log.push(msg); if(B.log.length > 40) B.log.shift(); }
const mostWounded = u => friends(u).reduce((a, b) => (a.hp / a.maxHp <= b.hp / b.maxHp ? a : b));

// Your side: leader + active squadmates (you control them too) + pet (AI). Squadmates share the leader's clan perks.
function playerTeam(carry){
  const c = S.char, st = charStats(c), p = unitFromChar(c); p.key = 'leader';
  const team = [p];
  for(const r of activeSquad()){ const u = unitFromChar(Object.assign({}, r, {clan:c.clan}), 'player', 'ally'); u.isPlayer = false; u.isSquad = true; u.key = r.id; team.push(u); }
  if(c.pet && PET[c.pet]){ const pu = unitFromPet(c.pet, st, 'ally', c.bond[c.pet] || 0, c.level); pu.key = 'pet'; team.push(pu); }
  if(carry) for(const u of team){ const k = carry[u.key]; if(k){ u.hp = clamp(k.hp, 1, u.maxHp); u.cp = clamp(k.cp, 0, u.maxCp); } }
  return team;
}
function startMission(id){
  const m = MISSION[id]; if(!m) return;
  if(S.char.level < m.lvl) return toast(`Requires level ${m.lvl}`);

  startStage();
}
function startStage(){
  if(RUN.kind === 'mission'){
    const m = MISSION[RUN.id], st = m.stages[RUN.stage];
    const foes = st.foes.map(([id, l]) => unitFromEnemy(id, l)), n = activeSquad().length;
    if(n) foes.forEach(e => { e.maxHp = e.hp = Math.round(e.maxHp * (1 + 0.45 * n)); e.atk = Math.round(e.atk * (1 + 0.12 * n) * 10) / 10; }); // bigger squad, tougher foes
    startBattle(playerTeam(RUN.carry), foes, {title:m.name, stage:RUN.stage + 1, stages:m.stages.length, boss:!!st.boss});
  } else if(RUN.kind === 'arena'){
    startBattle(playerTeam(null), ghostTeam(RUN.ghost), {title:`Echo Arena: ${RUN.ghost.name}`, stage:1, stages:1, sub:RUN.ghost.archetype || 'Ghost build'});
  } else if(RUN.kind === 'event'){
    startBattle(playerTeam(null), [RUN.boss], {title:'Crimson Moon', stage:1, stages:1, boss:true, roundLimit:EVENT_ROUNDS, sub:`Survive and deal damage for ${EVENT_ROUNDS} rounds`});
  }
}
function startBattle(allies, enemies, meta){
  B = {allies, enemies, meta, round:0, queue:[], log:[], over:false, awaiting:false, active:null, target:enemies[0].uid, fseq:0};
  UI.screen = 'battle'; UI.itemPanel = false;
  closeModal(); render(); window.scrollTo(0, 0);
  log(`${meta.boss ? '⚠️ Boss battle! ' : ''}${enemies.map(e => `<b>${esc(e.name)}</b>`).join(', ')} ${enemies.length > 1 ? 'appear' : 'appears'}!`);
  if(allies.find(a => a.isPet)) log(`🐾 ${esc(allies.find(a => a.isPet).name)} fights at your side.`);

}
function beginRound(){
  if(B.meta.roundLimit && B.round >= B.meta.roundLimit){
    B.over = true; B.awaiting = false; log(`🌘 The blood moon sets. Time is up!`); updateBattle(); later(() => finishRun('timeout'), 1100); return;
  }
  B.round++;
  B.queue = allUnits().filter(u => u.alive).map(u => [u, effAgi(u) + Math.random() * 0.5]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  nextTurn();
}
function checkEnd(){
  if(B.over) return true;
  if(B.allies.filter(u => !u.isPet).every(u => !u.alive)){ B.over = true; B.awaiting = false; updateBattle(); later(stageLost, 1000); return true; }
  if(B.enemies.every(u => !u.alive)){ B.over = true; B.awaiting = false; updateBattle(); later(stageWon, 1000); return true; }
  return false;
}
function nextTurn(){
  if(checkEnd()) return;
  if(!B.queue.length) return beginRound();
  const u = B.queue.shift();
  if(!u.alive) return nextTurn();
  B.active = u; B.fseq = 0;
  startOfTurn(u);
  updateBattle();
  if(!u.alive){ later(nextTurn, 800); return; }
  if(hasStatus(u, 'stun')){
    log(`💫 <b>${esc(u.name)}</b> is stunned and can't move!`); float(u, 'Stunned', 'fl-status fl-debuff');
    endOfTurn(u); updateBattle(); later(nextTurn, 950); return;
  }
  if(u.controller === 'player'){ B.awaiting = true; if(!opponents(u).find(e => e.uid === B.target)) retarget(); updateBattle(); if(S.settings.auto) later(autoAct, 500); else if(u.isSquad) sfx('click'); }
  else later(() => { B.fseq = 0; aiAct(u); endOfTurn(u); updateBattle(); later(nextTurn, 850); }, 650);
}
function startOfTurn(u){
  u.turns++;
  for(const k in u.cds) if(u.cds[k] > 0) u.cds[k]--;
  for(const st of [...u.statuses]){
    if(!u.alive) break;
    if(st.s === 'burn' || st.s === 'bleed'){ dealDamage(u, st.val, {cls:'fl-' + st.s}); log(`${STATUSES[st.s].icon} ${esc(u.name)} takes ${st.val} ${st.s} damage.`); }

function endOfTurn(u){ u.statuses.forEach(x => x.dur--); u.statuses = u.statuses.filter(x => x.dur > 0); }
function retarget(){ const n = B.enemies.find(e => e.alive); if(n) B.target = n.uid; }

function attack(att, def, o){
  let landed = false;
  for(let i = 0; i < (o.hits || 1); i++){
    if(!def.alive) break;
    if(Math.random() * 100 < dodgeChance(att, def) * (o.dodgeMult == null ? 1 : o.dodgeMult)){
      float(def, 'Dodge', 'fl-miss'); log(`${esc(def.name)} dodges!`); continue;
    }
    let d = att.atk * o.power * rand(0.9, 1.1);
    const em = elemMult(o.el, def.el); d *= em;
    if(o.el && att.elemBoost === o.el) d *= 1 + att.elemPct;
    if(hasStatus(att, 'empower')) d *= 1.3;
    if(hasStatus(att, 'weaken')) d *= 0.75;
    if(hasStatus(def, 'guard')) d *= 0.65;
    if(hasStatus(def, 'expose')) d *= 1.25;
    const crit = Math.random() * 100 < att.crit + (o.critBonus || 0);
    if(crit) d *= 1.5;
    d = Math.max(1, Math.round(d));
    dealDamage(def, d, {crit, em});
    if(att.side === 'ally' && att.controller === 'player'){ if(crit) S.counters.crits++; if(em > 1) S.counters.strong++; }
    log(`${esc(att.name)} hits ${esc(def.name)} for <b>${d}</b>${crit ? ' — critical!' : ''}${em > 1 ? ' (strong element)' : em < 1 ? ' (weak element)' : ''}`);
    landed = true;
  }

}
function dealDamage(u, d, o = {}){
  if(!u.alive) return;

  const dl = float(u, `-${d}${o.crit ? '!' : ''}${o.em > 1 ? ' ▲' : o.em < 1 ? ' ▼' : ''}`, cls);
  anim(u, 'hit', dl); setTimeout(() => sfx(o.crit ? 'crit' : 'hit'), dl);
  if(u.hp <= 0){
    u.alive = false; u.statuses = [];
    log(`💀 <b>${esc(u.name)}</b> is defeated!`);
    if(u.side === 'enemy' && RUN){ RUN.xp += u.xp || 0; RUN.gold += u.gold || 0; }
    if(B.target === u.uid) retarget();

  }
}
function heal(u, amt){ amt = Math.min(amt, u.maxHp - u.hp); if(amt <= 0 || !u.alive) return; u.hp += amt; float(u, `+${amt}`, 'fl-heal'); sfx('heal'); }
function restoreCp(u, amt){ amt = Math.min(amt, u.maxCp - u.cp); if(amt <= 0) return; u.cp += amt; float(u, `+${amt} CP`, 'fl-cp'); }

}
function aiAct(u){

function stageWon(){

function addClanRep(n){ const c = S.char; if(!c.clan || !n) return 0; const before = clanTier(c.clan.rep); c.clan.rep += n; return clanTier(c.clan.rep) > before ? clanTier(c.clan.rep) : 0; }
function finishRun(outcome, fled = false){

    } else { S.arena.rating = Math.max(0, S.arena.rating - 10); S.arena.losses++; }
    res.lines.unshift(`🏟️ Echo rating ${oldR} → <b>${S.arena.rating}</b> (${arenaTier(S.arena.rating).name})`);
  } else if(RUN.kind === 'event'){

    res.lines.push(`<span class="shardline">🔴 +${sh} Moon Shards</span>`);
    if(boss.hp <= 0 && before < ev.pool){ ev.kills++; res.lines.push('🏆 You struck the final blow this week!'); }
    res.xp += Math.round(xpToNext(c.level) * 0.05); res.gold += 20 + c.level * 5;
    if(c.clan){ res.lines.push(`${CLAN[c.clan.id].crest} +10 clan reputation`); res.clanUp = addClanRep(10); }
  }
  if(petUnit && (win || RUN.kind === 'event')){
    c.bond[c.pet] = (c.bond[c.pet] || 0) + 1;
    if(c.bond[c.pet] % 5 === 0 && bondLevel(c.bond[c.pet]) <= 10) res.lines.push(`🐾 ${PET[c.pet].name} reached bond level ${bondLevel(c.bond[c.pet])}!`);
  }
  if(res.clanUp) res.lines.push(`🎖️ Clan rank up: ${CLAN_TIERS[res.clanUp].name}! Clan perks grow stronger.`);
  c.gold += res.gold;
  res.items.forEach(it => addInv(it.id, 1));
  res.ups = gainXp(res.xp);
  if(win || RUN.kind === 'event') for(const su of squadUnits){
    const r = S.squad.roster.find(x => x.id === su.key); if(!r) continue;

}

/* ---- Crimson Moon event ---- */
const DAY = 864e5;
function weekIndex(){ return Math.floor((Date.now() / DAY + 3) / 7); }  // weeks start Monday 00:00 UTC
function msToNextWeek(){ return ((weekIndex() + 1) * 7 - 3) * DAY - Date.now(); }
function todayKey(){ return new Date().toISOString().slice(0, 10); }
function syncEvent(){
  const ev = S.event, w = weekIndex();
  if(ev.week !== w) Object.assign(ev, {week:w, bossId:EVENT_BOSSES[((w % EVENT_BOSSES.length) + EVENT_BOSSES.length) % EVENT_BOSSES.length], dmg:0, claimed:[], best:0});
  if(ev.dmg === 0){ // boss level locks in with the first hit of the week
    const lvl = Math.max(5, S.char.level + 2);
    ev.bossLvl = lvl; ev.pool = Math.round(enemyStats(lvl).hp * ENEMY[ev.bossId].hpM * EVENT_POOL);
  }
  if(ev.day !== todayKey()){ ev.day = todayKey(); ev.tries = 0; }
}
function startEvent(){
  syncEvent(); const ev = S.event;
  if(S.char.level < EVENTS[0].lvl) return toast(`Requires level ${EVENTS[0].lvl}`);
  if(ev.dmg >= ev.pool) return toast('The boss is already defeated this week');
  if(ev.tries >= EVENT_TRIES) return toast('No attempts left today');
  ev.tries++; persist();
  const boss = unitFromEnemy(ev.bossId, ev.bossLvl);
  boss.maxHp = ev.pool; boss.hp = ev.pool - ev.dmg; boss.enrage = 0.5; boss.xp = 0; boss.gold = 0;
  if(boss.hp < boss.maxHp * 0.5){ boss.enraged = true; boss.statuses.push({s:'empower', dur:99, val:0}); }
  RUN = {kind:'event', xp:0, gold:0, boss, startHp:boss.hp, stages:1};
  startStage();
}

/* ---------------- Sound (tiny WebAudio synth) ---------------- */
let AC = null, lastSfx = 0;
function sfx(type){
  if(!S || !S.settings.sound) return;
  const now = performance.now(); if(now - lastSfx < 45) return; lastSfx = now;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const N = {hit:[[220,.06,'square']], crit:[[330,.05,'square'],[520,.08,'square']], heal:[[523,.07,'sine'],[784,.1,'sine']],
      skill:[[392,.05,'triangle'],[587,.07,'triangle']], win:[[523,.08,'triangle'],[659,.08,'triangle'],[784,.14,'triangle']],
      lose:[[330,.12,'sine'],[247,.18,'sine']], click:[[660,.03,'sine']], coin:[[880,.05,'square'],[1320,.07,'square']]}[type] || [];
    let t = AC.currentTime;
    for(const [f, d, w] of N){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = w; o.frequency.value = f; g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.8;
    }
  }catch(e){}
}

/* ---------------- Auto-battle (smart local AI for your turns) ---------------- */
function autoAct(){
  if(!B || !B.awaiting || B.over) return;
  const p = B.active, t = getTarget(), ready = p.skills.map(id => SKILL[id]).filter(s => s && canUse(p, s));
  const healS = ready.find(s => s.heal && s.target !== 'ally');
  if(p.hp < p.maxHp * 0.35){
    if(healS) return ACT.bSkill(healS.id);
    const pot = ['moon_elixir','g_salve','salve'].find(id => S.inventory[id] > 0 && S.char.level >= ITEM[id].lvl);
    if(pot) return ACT.bUse(pot);
  }
  const buff = ready.find(s => s.target === 'self' && !s.heal && !s.power && !(s.apply || []).every(a => hasStatus(p, a.s)));
  if(buff && Math.random() < 0.6) return ACT.bSkill(buff.id);
  const foes = opponents(p).length;
  const off = ready.filter(s => s.power).map(s => [s, s.power * s.hits * elemMult(s.el, t.el) * (s.target === 'allEnemies' ? foes : 1) + (s.apply || []).length * 0.2]).sort((a, b) => b[1] - a[1]);
  if(off.length) return ACT.bSkill(off[0][0].id);
  if(p.cp < p.maxCp * 0.3) return ACT.bCharge();
  ACT.bAttack();
}

async function guideAsk(text){
  if(GUIDE.busy || !text.trim()) return;
  guideSay('you', text);
  if(GUIDE.mode === 'offline') return offlineGuide(text);
  GUIDE.busy = true; GUIDE.undo = null; GUIDE.pending = null; renderGuide();
  const snapshot = JSON.stringify(S); let changed = false;
  const convo = GUIDE.msgs.filter(m => !m.extra).slice(-10).map(m => ({role:m.role === 'you' ? 'user' : 'assistant', content:m.text}));
  while(convo.length && convo[0].role !== 'user') convo.shift();
  const first = {role:'user', content:GUIDE_RULES + '\n\nCurrent state:\n' + JSON.stringify(guideState())};
  const wrap = t => ({name:t.name, description:t.description, schema:t.schema, run:inp => { const r = t.run(inp || {}); if(t.mutates){ changed = true; persist(); render(); } return r; }});
  const tools = GUIDE_TOOLS.map(wrap);
  try{
    let text;
    if(GUIDE.mode === 'claude'){
      GUIDE.ctl = new AbortController();
      const res = await GUIDE.sample([first, ...convo], {modelTier:'quick', signal:GUIDE.ctl.signal, tools:tools.map(t => ({name:t.name, description:t.description, inputSchema:t.schema, execute:t.run}))});
      text = res.text;
    } else text = await byokAsk([first, ...convo], tools);
    guideSay('momo', (text || '').trim() || 'Done!');
  }catch(e){
    const code = e && e.code;
    if(code === 'cancelled') guideSay('momo', 'Okay, I stopped.');
    else if(code === 'not_granted' || code === 'sampling_disabled'){ GUIDE.mode = 'offline'; guideSay('momo', "I can't reach Claude here, so I'll help the simple way."); offlineGuide(text); }
    else if(code === 'rate_limited') guideSay('momo', "I'm a little out of breath. Try again in a moment!");
    else guideSay('momo', 'Something went wrong reaching Claude: ' + ((e && e.message) || 'unknown error'));
  }
  GUIDE.busy = false; if(changed) GUIDE.undo = snapshot; renderGuide();
  if(GUIDE.pending){ const f = GUIDE.pending; GUIDE.pending = null; GUIDE.open = false; renderGuide(); f(); }
}
async function byokAsk(messages, tools){
  const key = getKey(); if(!key) throw new Error('No API key saved');
  const defs = tools.map(t => ({name:t.name, description:t.description, input_schema:t.schema || {type:'object', properties:{}}}));
  let msgs = messages.map(m => ({role:m.role, content:m.content}));
  // merge consecutive user turns for the Messages API
  msgs = msgs.reduce((a, m) => { if(a.length && a[a.length - 1].role === m.role) a[a.length - 1].content += '\n\n' + m.content; else a.push(m); return a; }, []);
  for(let round = 0; round < 6; round++){
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:800, tools:defs, messages:msgs})});
    const d = await r.json(); if(!r.ok) throw new Error((d.error && d.error.message) || r.statusText);
    msgs.push({role:'assistant', content:d.content});
    const uses = d.content.filter(b => b.type === 'tool_use');
    if(!uses.length) return d.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
    msgs.push({role:'user', content:uses.map(u => { let out; try{ out = JSON.stringify(tools.find(t => t.name === u.name).run(u.input)); }catch(e){ out = 'Error: ' + e.message; } return {type:'tool_result', tool_use_id:u.id, content:String(out).slice(0, 8000)}; })});
  }
  return 'Done!';
}
/* Offline helper: rule-based advice with one-tap actions (works anywhere, no AI needed). */
function suggestions(){

  if(c.points){ const w = {fire:[1,1,2], wind:[1,1,3], lightning:[1,2,2], earth:[3,1,1], water:[2,2,1]}[c.element], t = w[0] + w[1] + w[2];
    const a = {hp:Math.round(c.points * w[0] / t), cp:Math.round(c.points * w[1] / t)}; a.agi = c.points - a.hp - a.cp;
    out.push({text:`Spend your ${c.points} stat points (${a.hp} HP, ${a.cp} Chakra, ${a.agi} Agility suits a ${ELEMENTS[c.element].name} ninja).`, tool:'allocate_points', input:a}); }
  const claim = S.daily.quests.some(q => !q.claimed && questProgress(q) >= q.n) || EVENT_MILESTONES.some((m, i) => !S.event.claimed.includes(i) && S.event.dmg / S.event.pool * 100 >= m.pct);
  if(claim) out.push({text:'You have rewards waiting to be claimed.', tool:'claim_rewards', input:{}});
  const sk = SKILLS.find(s => s.el === c.element && !s.enemyOnly && !s.petOnly && s.lvl <= c.level && !c.skills.includes(s.id) && c.gold >= s.price);
  if(sk) out.push({text:`Learn ${sk.name} at the Academy for ${sk.price} gold.`, tool:'learn_skill', input:{id:sk.id}});
  for(const sl of SLOTS){
    const cur = ITEM[c.equip[sl]], score = it => it ? Object.entries(it.bonus || {}).reduce((a, [k, v]) => a + v * ({hp:.25, cp:.3, agi:2, atk:2.5, crit:1.5, dodge:1.5}[k] || 1), 0) : 0;
    const best = ITEMS.filter(i => i.slot === sl && i.shop !== false && !i.shards && i.lvl <= c.level && i.price <= c.gold * 0.8).sort((a, b) => score(b) - score(a))[0];
    if(best && score(best) > score(cur) * 1.15 && !(S.inventory[best.id] > 0)){ out.push({text:`Buy and equip ${best.name} (${fmtBonus(best.bonus)}) for ${best.price} gold.`, tool:'buy_equip', input:{id:best.id}}); break; }
  }
  if(c.level >= SQUAD_LVL && S.squad.roster.length < MAX_SQUAD){ syncPool(); const pi = S.squad.pool.findIndex(r => r.cost <= c.gold * 0.7); if(pi >= 0) out.push({text:`Recruit ${S.squad.pool[pi].name} (${ELEMENTS[S.squad.pool[pi].element].name}, Lv ${S.squad.pool[pi].level}) for ${S.squad.pool[pi].cost} gold. Squadmates fight beside you!`, tool:'recruit_ninja', input:{index:pi}}); }
  for(const r of activeSquad()) if(r.points){ out.push({text:`${r.name} has ${r.points} points to spend.`, tool:'manage_recruit', input:{id:r.id, auto:true}}); break; }
  for(const r of activeSquad()) if(r.level < c.level && trainsLeft(r) > 0 && c.gold >= trainCost(r) * 3){ out.push({text:`Train ${r.name} (Lv ${r.level}) for ${trainCost(r)} gold.`, tool:'train_recruit', input:{id:r.id}}); break; }
  if(!c.pets.length && c.level >= 3){ const p = PETS.filter(p => !p.shards && p.lvl <= c.level && p.price <= c.gold).pop(); if(p) out.push({text:`Adopt ${p.name} at the Beast Den. Pets fight beside you!`, tool:'adopt_pet', input:{id:p.id}}); }
  if(!c.clan && c.level >= 5 && c.gold >= 300){ const cl = CLANS.find(x => x.perk.elem === c.element) || CLANS.find(x => x.lvl <= c.level); out.push({text:`Join the ${cl.name} for ${clanPerkText(cl, 0)}.`, tool:'join_clan', input:{id:cl.id}}); }

  return out;
}

function offlineGuide(text){
  const hit = FAQ.find(([re]) => re.test(text || ''));
  const sug = suggestions();
  if(hit && !/next|do|help|spend|gear|pick|claim/i.test(text)) return guideSay('momo', hit[1]);
  let pick = sug;
  if(/spend|point/i.test(text)) pick = sug.filter(s => s.tool === 'allocate_points');
  else if(/gear|equip|buy/i.test(text)) pick = sug.filter(s => s.tool === 'buy_equip');
  else if(/mission|fight|battle/i.test(text)) pick = sug.filter(s => s.tool === 'start_battle');
  else if(/claim|reward/i.test(text)) pick = sug.filter(s => s.tool === 'claim_rewards');
  if(!pick.length) return guideSay('momo', /spend|point/i.test(text) ? 'You have no unspent points right now.' : /gear/i.test(text) ? 'Your gear is looking good for your level and budget!' : /claim/i.test(text) ? 'Nothing to claim yet. Keep going!' : 'Hmm, I have no special tips right now. A mission is always a good idea!');
  GUIDE.offerList = pick.slice(0, 4);
  guideSay('momo', pick.length > 1 ? "Here's what I'd do next. Tap one and I'll take care of it:" : pick[0].text,
    `<div class="g-acts">${GUIDE.offerList.map((s, i) => `<button class="btn sm ${i ? '' : 'primary'}" data-act="guideDo" data-arg="${i}">${pick.length > 1 ? esc(s.text) : 'Do it for me'}</button>`).join('')}</div>`);
}
function guideDo(i){
  const s = (GUIDE.offerList || [])[+i]; if(!s) return;
  const snap = JSON.stringify(S);
  try{
    let r;
    if(s.tool === 'buy_equip'){ GUIDE_TOOLS.find(t => t.name === 'buy_item').run(s.input); r = GUIDE_TOOLS.find(t => t.name === 'equip_item').run(s.input); }
    else r = GUIDE_TOOLS.find(t => t.name === s.tool).run(s.input);
    persist(); GUIDE.undo = snap; GUIDE.offerList = null;
    GUIDE.msgs.forEach(m => { m.extra = null; });

    if(GUIDE.pending){ const f = GUIDE.pending; GUIDE.pending = null; GUIDE.open = false; renderGuide(); f(); } else render();
  }catch(e){ guideSay('momo', 'I couldn\'t do that: ' + e.message); }
}

async function initNet(){
  if(!(window.claude && window.claude.use)) return;
  const use = n => window.claude.use(n).catch(() => null);
  const [db, room, user, sample] = await Promise.all([use('db'), use('room'), use('user'), use('sample')]);
  NET.db = db; NET.room = room; NET.user = user;
  if(sample){ GUIDE.sample = sample; try{ const lim = await sample.limits(); GUIDE.mode = lim && lim.tools !== false ? 'claude' : 'offline'; }catch(e){ GUIDE.mode = 'claude'; } }
  if(user) NET.uid = await user.id().catch(() => null);

    db.collection('echoes').orderBy('rating', 'desc').limit(60).onSnapshot(s => { NET.echoes = s.docs.map(d => Object.assign({id:d.id}, d.data())); netChanged(); }, () => {});
    db.collection('hires').onSnapshot(s => { NET.hires = s.docs.map(d => Object.assign({id:d.id}, d.data())); netChanged(); }, () => {});
    db.collection('raidhits').onSnapshot(s => { NET.raid = s.docs.map(d => Object.assign({id:d.id}, d.data())); netChanged(); }, () => {});
  }
  if(room){

    room.on('shout', m => { const d = m.data || {}; NET.chat.push({name:String(d.name || 'Someone').slice(0, 16), text:String(d.text || '').slice(0, 140), me:m.isMe, t:Date.now()}); if(NET.chat.length > 40) NET.chat.shift(); netChanged(); });

/* =====================================================================
   SQUAD: recruit ninja, train them, and command them in battle.
   Online: hire echoes of real players, and your squad travels with your echo.
   ===================================================================== */
const MAX_ROSTER = 6, MAX_SQUAD = 2, TRAIN_PER_DAY = 3, SQUAD_LVL = 3;
function defaultSquad(){ return {roster:[], active:[], pool:[], poolDay:'', train:{day:'', n:{}}, hired:[], hireClaims:0}; }
const activeSquad = () => (S && S.squad ? S.squad.active : []).map(id => S.squad.roster.find(r => r.id === id)).filter(Boolean);
const recruitById = id => S.squad.roster.find(r => r.id === id);
const hireCost = (l, real) => real ? 150 + l * 50 : 100 + l * 40;
const trainCost = r => 20 + r.level * 15;
const trainsLeft = r => { const t = S.squad.train; if(t.day !== todayKey()){ t.day = todayKey(); t.n = {}; } return TRAIN_PER_DAY - (t.n[r.id] || 0); };
const recruitSkillPrice = (r, s) => s.el === r.element ? s.price : s.price * 2;
const newId = () => 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
function asRecruit(g, origin){
  g.id = newId(); g.origin = origin; g.xp = 0; g.points = 0; g.pet = null; g.pets = []; g.bond = {}; g.clan = null; g.squad = []; delete g.diff;
  g.bound = {}; for(const sl of SLOTS) if(g.equip[sl]) g.bound[sl] = true;  // starting gear is bound to the recruit
  return g;
}
function syncPool(force){
  const q = S.squad;
  if(!force && q.poolDay === todayKey() && q.pool.length) return;
  const L = S.char.level, els = [...EL_ORDER].sort(() => Math.random() - 0.5);
  q.pool = [L - 2, L - 1, L].map((l, i) => { const g = makeGhost(Math.max(1, l), 0); g.element = els[i]; return asRecruit(normChar(Object.assign(g, {skills:[], loadout:[]}, {skills:SKILLS.filter(s => s.el === els[i] && s.lvl <= Math.max(1, l) && !s.enemyOnly && !s.petOnly).slice(-3).map(s => s.id)})), 'npc'); });
  q.pool.forEach(r => { r.loadout = r.skills.slice(0, MAX_LOADOUT); r.cost = hireCost(r.level); });
  q.poolDay = todayKey();
}
function gainXpFor(r, amt){
  const ups = [], cap = S.char.level;
  r.xp += amt;
  while(r.level < cap && r.xp >= xpToNext(r.level)){ r.xp -= xpToNext(r.level); r.level++; r.points += POINTS_PER_LEVEL; ups.push(r.level); }
  if(r.level >= cap) r.xp = Math.min(r.xp, xpToNext(r.level) - 1);
  return ups;
}
// An echo of a real player joins at no higher than your level, with points and techniques scaled to fit.
function recruitFromEcho(e){
  let g; try{ g = normChar(JSON.parse(e.build)); }catch(err){ return null; }
  const L = Math.min(g.level, S.char.level), total = g.alloc.hp + g.alloc.cp + g.alloc.agi, budget = (L - 1) * POINTS_PER_LEVEL, k = total ? Math.min(1, budget / total) : 0;
  g.alloc = {hp:Math.floor(g.alloc.hp * k), cp:Math.floor(g.alloc.cp * k), agi:Math.floor(g.alloc.agi * k)};
  g.level = L; g.skills = g.skills.filter(id => SKILL[id].lvl <= L); if(!g.skills.length) g.skills = [starterSkill(g.element)];
  g.loadout = g.loadout.filter(id => g.skills.includes(id)); if(!g.loadout.length) g.loadout = g.skills.slice(0, MAX_LOADOUT);
  for(const sl of SLOTS) if(g.equip[sl] && ITEM[g.equip[sl]].lvl > L) g.equip[sl] = null;
  g = asRecruit(g, 'echo'); g.fromId = e.id; g.fromName = String(e.name || '').slice(0, 16); g.archetype = 'Echo of a real ninja';
  return g;
}
function addToRoster(r){
  const q = S.squad; if(q.roster.length >= MAX_ROSTER) throw new Error(`Your roster is full (${MAX_ROSTER}). Dismiss someone first.`);
  q.roster.push(r); if(q.active.length < MAX_SQUAD) q.active.push(r.id);
}
function hireFromPool(i){
  syncPool(); const r = S.squad.pool[i]; if(!r) throw new Error('No such candidate');
  if(S.char.level < SQUAD_LVL) throw new Error(`The lodge opens at level ${SQUAD_LVL}`);
  if(S.char.gold < r.cost) throw new Error('Not enough gold');
  addToRoster(r); S.char.gold -= r.cost; S.squad.pool.splice(i, 1); return `${r.name} joined your squad`;
}
function trainRecruit(r){
  if(!r) throw new Error('No such recruit');
  if(r.level >= S.char.level) throw new Error(`${r.name} can't outgrow the leader. Level up first!`);
  if(trainsLeft(r) <= 0) throw new Error(`${r.name} is worn out. Train again tomorrow.`);
  const cost = trainCost(r); if(S.char.gold < cost) throw new Error('Not enough gold');
  S.char.gold -= cost; S.squad.train.n[r.id] = (S.squad.train.n[r.id] || 0) + 1;
  const xp = Math.round(xpToNext(r.level) * 0.35), ups = gainXpFor(r, xp);
  return `${r.name} trained hard: +${xp} XP${ups.length ? `, reached level ${r.level}!` : ''}`;
}
function unequipRecruit(r, sl){
  const id = r.equip[sl]; if(!id) return;
  if(!r.bound[sl]) addInv(id, 1);
  r.equip[sl] = null; delete r.bound[sl];
}
function equipRecruit(r, id){
  const it = ITEM[id]; if(!it || !SLOTS.includes(it.slot)) throw new Error('Not equipment');
  if(!(S.inventory[id] > 0)) throw new Error('Not in your pack');
  if(r.level < it.lvl) throw new Error(`${r.name} needs level ${it.lvl}`);
  unequipRecruit(r, it.slot); addInv(id, -1); r.equip[it.slot] = id; return `${r.name} equipped ${it.name}`;
}
function learnRecruit(r, id){
  const s = SKILL[id]; if(!s || s.enemyOnly || s.petOnly) throw new Error('No such technique');
  if(r.skills.includes(id)) throw new Error('Already learned'); if(r.level < s.lvl) throw new Error(`${r.name} needs level ${s.lvl}`);
  const cost = recruitSkillPrice(r, s); if(S.char.gold < cost) throw new Error('Not enough gold');
  S.char.gold -= cost; r.skills.push(id); if(r.loadout.length < MAX_LOADOUT) r.loadout.push(id); return `${r.name} learned ${s.name}`;
}
function allocRecruit(r, a){
  const t = (a.hp | 0) + (a.cp | 0) + (a.agi | 0); if(t > r.points || t < 0) throw new Error(`${r.name} has ${r.points} points`);
  for(const k of ['hp','cp','agi']){ const v = Math.max(0, a[k] | 0); r.alloc[k] += v; r.points -= v; } return charStats(r);
}
function autoAllocRecruit(r){
  const w = {fire:[1,1,2], wind:[1,1,3], lightning:[1,2,2], earth:[3,1,1], water:[2,2,1]}[r.element], t = w[0] + w[1] + w[2];
  const a = {hp:Math.round(r.points * w[0] / t), cp:Math.round(r.points * w[1] / t)}; a.agi = r.points - a.hp - a.cp; return a;
}
function hiredBy(){ // how many other players have recruited your echo
  if(!NET.uid) return 0;
  return (NET.hires || []).filter(h => h.id !== NET.uid && Array.isArray(h.ids) && h.ids.includes(NET.uid)).length;
}

  NET.db.doc('hires/' + NET.uid).set({ids:S.squad.hired.slice(-50), name:S.char.name, updatedAt:Date.now()}).catch(() => {});

/* ---------------- Actions ---------------- */
const tryDo = f => { try{ const m = f(); persist(); render(); if(m) toast(m); }catch(e){ toast(e.message); } };
const splitArg = a => { const i = a.indexOf(':'); return [a.slice(0, i), a.slice(i + 1)]; };
const SQUAD_ACT = {
  squadToggle: id => tryDo(() => { const q = S.squad, i = q.active.indexOf(id); if(i >= 0){ q.active.splice(i, 1); return 'Benched'; } if(q.active.length >= MAX_SQUAD) throw new Error(`Squad is full (${MAX_SQUAD}). Bench someone first.`); q.active.push(id); return `${recruitById(id).name} joins the squad`; }),
  trainR: id => tryDo(() => { const m = trainRecruit(recruitById(id)); sfx('coin'); return m; }),
  manageR: id => { UI.recruitId = id; go('recruit'); },
  allocR: a => tryDo(() => { const [id, k] = splitArg(a), r = recruitById(id); allocRecruit(r, {[k]:1}); }),
  autoAllocR: id => tryDo(() => { const r = recruitById(id); allocRecruit(r, autoAllocRecruit(r)); return 'Points assigned'; }),
  equipR: a => tryDo(() => { const [id, item] = splitArg(a); return equipRecruit(recruitById(id), item); }),
  unequipR: a => tryDo(() => { const [id, sl] = splitArg(a); unequipRecruit(recruitById(id), sl); }),
  learnR: a => tryDo(() => { const [id, sk] = splitArg(a); return learnRecruit(recruitById(id), sk); }),
  loadR: a => tryDo(() => { const [id, sk] = splitArg(a), r = recruitById(id), i = r.loadout.indexOf(sk); if(i >= 0) r.loadout.splice(i, 1); else { if(r.loadout.length >= MAX_LOADOUT) throw new Error('Loadout full'); r.loadout.push(sk); } }),
  dismissR: id => { const r = recruitById(id); showModal(`Dismiss ${esc(r.name)}?`, '<p>They leave the lodge for good. Gear you gave them returns to your pack; bound gear leaves with them.</p>', [{label:'Keep them', act:'closeModal'}, {label:'Dismiss', act:'doDismissR', arg:id, cls:'bad'}]); },
  doDismissR: id => { closeModal(); const q = S.squad, r = recruitById(id); if(!r) return; for(const sl of SLOTS) unequipRecruit(r, sl); q.roster = q.roster.filter(x => x.id !== id); q.active = q.active.filter(x => x !== id); persist(); go('squad'); toast(`${r.name} has left`); },
  hireR: i => tryDo(() => hireFromPool(+i)),
  refreshPool: () => tryDo(() => { if(S.char.gold < 50) throw new Error('Not enough gold'); S.char.gold -= 50; syncPool(true); return 'New recruits posted'; }),
  hireEcho: id => tryDo(() => {
    const e = NET.echoes.find(x => x.id === id); if(!e) throw new Error('That ninja is gone');
    const r = recruitFromEcho(e); if(!r) throw new Error('That echo could not be read');
    const cost = hireCost(r.level, true); if(S.char.gold < cost) throw new Error('Not enough gold');
    addToRoster(r); S.char.gold -= cost; if(!S.squad.hired.includes(id)) S.squad.hired.push(id); publishHires(); publishEcho();
    return `${r.name}'s echo joined your squad`;
  }),
  claimHires: () => tryDo(() => { const n = Math.max(0, hiredBy() - S.squad.hireClaims); if(!n) return; S.squad.hireClaims += n; S.char.gold += n * 60; S.shards += n * 2; sfx('coin'); return `Fame pays! +${n * 60} gold, +${n * 2} shards`; }),
};

GUIDE_TOOLS.push(
  {name:'list_squad', description:'Lists the player\'s recruits (id, level, element, points, in squad or not, trains left today) and today\'s recruit board candidates (index, cost).',
   run:() => { syncPool(); return {roster:S.squad.roster.map(r => ({id:r.id, name:r.name, level:r.level, element:r.element, points:r.points, inSquad:S.squad.active.includes(r.id), trainsLeft:trainsLeft(r), trainCost:trainCost(r), loadout:r.loadout})), candidates:S.squad.pool.map((r, i) => ({index:i, name:r.name, level:r.level, element:r.element, cost:r.cost}))}; }},
  {name:'recruit_ninja', description:'Hires a candidate from today\'s recruit board by index (costs gold). They join the battle squad if a slot is free.', mutates:true,
   schema:{type:'object', properties:{index:{type:'integer'}}, required:['index']}, run:i => hireFromPool(i.index | 0)},
  {name:'train_recruit', description:'Pays gold for a training session that gives a recruit XP (3 per recruit per day, never above the leader\'s level).', mutates:true,
   schema:{type:'object', properties:{id:{type:'string'}}, required:['id']}, run:i => trainRecruit(recruitById(String(i.id)))},
  {name:'set_squad', description:'Chooses which recruits (up to 2 ids) fight in battles. An empty list means the leader fights alone.', mutates:true,
   schema:{type:'object', properties:{ids:{type:'array', items:{type:'string'}}}, required:['ids']},

  {name:'manage_recruit', description:'Improves one recruit: spend their points (hp, cp, agi, or auto:true), teach a technique id (learn), or equip an item id from the pack (equip).', mutates:true,
   schema:{type:'object', properties:{id:{type:'string'}, hp:{type:'integer'}, cp:{type:'integer'}, agi:{type:'integer'}, auto:{type:'boolean'}, learn:{type:'string'}, equip:{type:'string'}}, required:['id']},
   run:i => { const r = recruitById(String(i.id)); need(r, 'No such recruit'); const out = [];
     if(i.auto) allocRecruit(r, autoAllocRecruit(r)), out.push('points assigned'); else if(i.hp || i.cp || i.agi) allocRecruit(r, i), out.push('points spent');
     if(i.learn) out.push(learnRecruit(r, String(i.learn))); if(i.equip) out.push(equipRecruit(r, String(i.equip)));
     return `${r.name}: ${out.join(', ') || 'nothing changed'}`; }}
);

      ${EVENT_MILESTONES.map((m, i) => { const got = ev.claimed.includes(i), ok = pct >= m.pct;

        <button class="btn sm ${ok && !got ? 'primary' : ''}" data-act="eventClaim" data-arg="${i}" ${ok && !got ? '' : 'disabled'}>${got ? 'Claimed' : ok ? 'Claim' : 'Locked'}</button></div>`; }).join('')}</div>
    <h3 class="sub">Community raid</h3><div class="panel" id="net-raid">${raidHTML()}</div>
    <h3 class="sub">Moon Shard exchange</h3>
    <div class="stack">${shop.map(it => `<div class="panel item"><div class="item-ic">${it.icon}</div><div class="item-b"><b>${it.name}</b><small class="${it.bonus ? 'bonus' : ''}">${it.bonus ? fmtBonus(it.bonus) : it.desc}</small>${c.level < it.lvl ? `<small>Requires level ${it.lvl}</small>` : ''}${S.inventory[it.id] ? `<small>You own ${S.inventory[it.id]}.</small>` : ''}</div>
      <div class="item-act"><button class="btn primary sm" data-act="shardBuy" data-arg="${it.id}" ${S.shards >= it.shards && c.level >= it.lvl ? '' : 'disabled'}>🔴 ${it.shards}</button></div></div>`).join('')}
      <div class="panel item"><div class="item-ic">🐾</div><div class="item-b"><b>${PET.moon_wisp.name}</b><small>Exclusive pet. Adopt it at the Beast Den for 🔴 ${PET.moon_wisp.shards} shards.</small></div><div class="item-act"><button class="btn sm" data-act="go" data-arg="den">Beast Den</button></div></div>
    </div></section>`;
}

        <button class="btn sm ${ok && !q.claimed ? 'primary' : ''}" data-act="questClaim" data-arg="${i}" ${ok && !q.claimed ? '' : 'disabled'}>${q.claimed ? 'Claimed' : ok ? 'Claim' : 'In progress'}</button></div>`; }).join('')}</div>
